<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/avator.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/avator.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/avator.png' | relative_url }}" alt="{{ site.title }}" class="header-avatar">
        <span class="site-title">{{ site.title }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>
